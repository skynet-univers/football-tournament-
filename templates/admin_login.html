{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<section class="container reveal" style="max-width:420px; margin:60px auto;">
  <div class="glass" style="padding:32px; border-radius:var(--radius-lg);">
    <h1 style="margin-bottom:8px;">Admin Login</h1>
    <p class="section-sub" style="margin-bottom:24px;">Enter the admin password to manage matches.</p>

    {% if error %}
      <p style="color:var(--red-500); margin-bottom:16px;">{{ error }}</p>
    {% endif %}

    <form method="POST">
      <input
        type="password" name="password" placeholder="Password" required autofocus
        style="width:100%; padding:12px 14px; border-radius:var(--radius-sm);
               border:1px solid var(--border-soft); background:var(--bg-card);
               color:var(--text-primary); margin-bottom:16px; font-family:var(--font-body);">
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
    </form>
  </div>
</section>
{% endblock %}
